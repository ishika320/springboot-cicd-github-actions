<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Project Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/4b8b6c9d9f.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            margin-top: 80px;
            animation: fadeIn 2s ease-in-out;
        }

        .status-box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .status-box:hover {
            transform: scale(1.05);
        }

        .status {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background: #1e90ff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff9800;
        }

        .icons {
            font-size: 40px;
            margin-bottom: 15px;
            color: #1e90ff;
        }

        footer {
            margin-top: 60px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .time {
            margin-top: 10px;
            font-size: 18px;
        }

    </style>

</head>

<body>

<header>
    🚀 CI/CD Project Dashboard
</header>

<div class="container">

    <div class="status-box">

        <div class="icons">
            <i class="fas fa-server"></i>
        </div>

        <h2>Application Status</h2>

        <p class="status">
            ✅ Running Successfully
        </p>

        <p>
            Project: Automated CI/CD using GitHub Actions and Docker
        </p>

        <div class="time" id="time"></div>

        <button onclick="checkStatus()">
            🔍 Check Status
        </button>

        <br>

        <button onclick="refreshPage()">
            🔄 Refresh
        </button>

    </div>

</div>

<footer>
    © 2026 CI/CD DevOps Project | Powered by Docker & GitHub Actions
</footer>

<script>

function checkStatus() {
    alert("System is working successfully!");
}

function refreshPage() {
    location.reload();
}

function updateTime() {
    const now = new Date();
    document.getElementById("time").innerHTML =
        "🕒 Current Time: " + now.toLocaleString();
}

setInterval(updateTime, 1000);

</script>

</body>
</html>
